[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xueqiu-crawler"
version = "0.1.0"
description = "Xueqiu (xueqiu.com) discussion crawler with sentiment-analysis ready storage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "DrissionPage>=4.1.0.18",
    "requests>=2.31",
    "pandas>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "rich>=13.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "sqlalchemy>=2.0"]
nlp = ["snownlp>=0.12.3", "jieba>=0.42"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1.9",
    "mypy>=1.8",
]

[project.scripts]
xueqiu = "xueqiu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xueqiu.storage" = ["*.sql"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "slow: tests that hit network or browser",
    "integration: end-to-end tests",
]

# ---------- coverage ----------
[tool.coverage.run]
source = ["src/xueqiu"]
omit = ["*/cli.py", "*/__init__.py"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = ["E501"]  # line-too-long handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert in tests

# ---------- mypy ----------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
files = ["src/xueqiu"]
